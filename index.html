<script>
'use strict';
const $=id=>document.getElementById(id);
const KEYS={settings:'reviewmail_settings_v2',draft:'reviewmail_draft_v2',sponsors:'haoting_sponsors',remember:'reviewmail_remember_v2'};
const DEFAULTS={to:'',cc:[],sponsorCc:[],greeting:'您好：',signature:'',intro:'以下是節目的試聽音檔與文稿，再麻煩確認了，謝謝！'};
const FIELD_IDS=['otherShow','ep','date','title','copy','extra','sponsor'];
let storageOK=true,toastTimer,saveTimer;
function read(key,fallback){try{const value=localStorage.getItem(key);return value===null?fallback:JSON.parse(value);}catch{storageOK=false;return fallback;}}
function write(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true;}catch{storageOK=false;storageState();return false;}}
function remove(key){try{localStorage.removeItem(key);}catch{storageOK=false;storageState();}}
function strings(value){return Array.isArray(value)?value.filter(v=>typeof v==='string'):[];}
function normalizeSettings(raw){const obj=raw&&typeof raw==='object'?raw:{};const out={...DEFAULTS};for(const key of ['to','greeting','signature','intro'])if(typeof obj[key]==='string')out[key]=obj[key];out.cc=strings(obj.cc);out.sponsorCc=strings(obj.sponsorCc);return out;}
let settings=normalizeSettings(read(KEYS.settings,null));
let sponsors=strings(read(KEYS.sponsors,[])).slice(0,8);
function storageState(){ $('storageWarning').hidden=storageOK;$('saveStatus').textContent=storageOK?($('rememberDraft').checked?'已在此瀏覽器保留':'本集內容不保留'):'目前無法儲存';}
function localDate(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');}
function fmtDate(v){if(!/^\d{4}-\d{2}-\d{2}$/.test(v))return '';const d=new Date(v+'T00:00:00');if(Number.isNaN(d.getTime()))return '';return `${d.getMonth()+1}/${d.getDate()}(${['日','一','二','三','四','五','六'][d.getDay()]})`;}
function selectedShow(){return $('showSelect').value;}
function showName(){return selectedShow()==='__other__'?$('otherShow').value.trim():selectedShow();}
function ccList(){return [...new Set([...settings.cc,...($('hasSponsor').checked?settings.sponsorCc:[])])];}
function buildSubject(){const date=fmtDate($('date').value),show=showName(),ep=$('ep').value.trim(),sponsor=$('hasSponsor').checked?$('sponsor').value.trim():'';return `${date?date+'上線｜':''}${show?'《'+show+'》 ':''}${ep?'EP'+ep+' ':''}審聽${sponsor?'_'+sponsor+'贊助':''}`.trim();}
function buildBody(){const title=$('title').value.trim(),copy=$('copy').value.trim(),extra=$('extra').value.trim();const intro=extra?'附上節目試聽音檔與文稿，'+extra+'，再麻煩您了，謝謝！':settings.intro;let body=(settings.greeting||'您好：')+'\n'+intro+'\n';body+='\n（音檔請於 Gmail 中插入附件）\n';if(title)body+='\n標題：\n'+title+'\n';if(copy)body+='\n文案：\n'+copy+'\n';if(settings.signature)body+='\n'+settings.signature;return body;}
function gmailUrl(){const params=new URLSearchParams({view:'cm',fs:'1',to:settings.to,cc:ccList().join(','),su:buildSubject(),body:buildBody()});return 'https://mail.google.com/mail/?'+params.toString();}
function render(){ $('otherWrap').hidden=selectedShow()!=='__other__';$('sponsorWrap').hidden=!$('hasSponsor').checked;$('pvSubject').textContent=buildSubject();$('pvBody').textContent=buildBody();$('toLine').textContent=settings.to||'尚未設定';$('ccLine').textContent=ccList().join('、')||'—';$('setupBanner').hidden=!!settings.to;$('longNote').hidden=gmailUrl().length<7500;}
function switchTab(name,focus=false){const preview=name==='preview';for(const [id,active] of [['editTab',!preview],['previewTab',preview]]){$(id).setAttribute('aria-selected',String(active));$(id).tabIndex=active?0:-1;if(active&&focus)$(id).focus();}$('editPanel').hidden=preview;$('previewPanel').hidden=!preview;render();window.scrollTo({top:0,behavior:'instant'});}
$('editTab').addEventListener('click',()=>switchTab('edit'));
$('previewTab').addEventListener('click',()=>switchTab('preview'));
for(const id of ['editTab','previewTab'])$(id).addEventListener('keydown',event=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){event.preventDefault();switchTab(event.key==='Home'?'edit':event.key==='End'?'preview':id==='editTab'?'preview':'edit',true);}});
function toast(message){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').classList.add('show');toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2600);}
function draftData(){const draft={show:selectedShow(),hasSponsor:$('hasSponsor').checked};for(const id of FIELD_IDS)draft[id]=$(id).value;return draft;}
function saveDraft(){if($('rememberDraft').checked)write(KEYS.draft,draftData());storageState();}
function restoreDraft(){const d=read(KEYS.draft,null);if(!d||typeof d!=='object')return;for(const id of FIELD_IDS)if(typeof d[id]==='string')$(id).value=d[id];if([...$('showSelect').options].some(option=>option.value===d.show))$('showSelect').value=d.show;$('hasSponsor').checked=d.hasSponsor===true;}
function rememberSponsor(){const value=$('sponsor').value.trim();if(!value)return;sponsors=[value,...sponsors.filter(v=>v!==value)].slice(0,8);write(KEYS.sponsors,sponsors);renderHistory();}
function renderHistory(){const box=$('sponsorHistory');box.replaceChildren();for(const s of sponsors){const button=document.createElement('button');button.type='button';button.textContent=s;button.addEventListener('click',()=>{$('sponsor').value=s;render();saveDraft();});box.append(button);}}
async function copyText(text,label){try{if(!navigator.clipboard?.writeText)throw new Error();await navigator.clipboard.writeText(text);toast(label);}catch{ $('manualCopy').value=text;$('copyDialog').showModal();$('manualCopy').focus();$('manualCopy').select();}}
function populateSettings(value){$('settingTo').value=value.to;$('settingCc').value=value.cc.join(', ');$('settingSponsorCc').value=value.sponsorCc.join(', ');$('settingGreeting').value=value.greeting;$('settingSignature').value=value.signature;$('settingIntro').value=value.intro;}
function openSettings(){populateSettings(settings);$('settingsError').hidden=true;$('settingsDialog').showModal();}
function splitEmails(value){return [...new Set(value.split(/[,;，；、\s]+/).map(v=>v.trim()).filter(Boolean))];}
function validEmail(value){return /^[^\s@,;<>]+@[^\s@,;<>]+\.[^\s@,;<>]+$/.test(value);}
$('settingsForm').addEventListener('submit',event=>{event.preventDefault();const next={to:$('settingTo').value.trim(),cc:splitEmails($('settingCc').value),sponsorCc:splitEmails($('settingSponsorCc').value),greeting:$('settingGreeting').value.trim()||DEFAULTS.greeting,signature:$('settingSignature').value.trim(),intro:$('settingIntro').value.trim()||DEFAULTS.intro};const invalid=[next.to,...next.cc,...next.sponsorCc].find(v=>!validEmail(v));if(invalid!==undefined){$('settingsError').textContent='請確認信箱格式：'+(invalid||'收件人不可留空');$('settingsError').hidden=false;return;}settings=next;const saved=write(KEYS.settings,settings);$('settingsDialog').close();render();toast(saved?'已儲存寄信設定':'本次可使用；瀏覽器無法保留設定');});
$('settingsBtn').addEventListener('click',openSettings);$('setupLink').addEventListener('click',openSettings);
for(const id of ['closeSettings','cancelSettings'])$(id).addEventListener('click',()=>$('settingsDialog').close());
$('closeCopy').addEventListener('click',()=>$('copyDialog').close());
$('episodeForm').addEventListener('submit',event=>event.preventDefault());
$('episodeForm').addEventListener('input',()=>{render();clearTimeout(saveTimer);saveTimer=setTimeout(saveDraft,180);});
$('episodeForm').addEventListener('change',()=>{render();saveDraft();});
$('sponsor').addEventListener('change',rememberSponsor);
$('rememberDraft').addEventListener('change',()=>{write(KEYS.remember,$('rememberDraft').checked);if($('rememberDraft').checked)saveDraft();else{remove(KEYS.draft);storageState();}toast($('rememberDraft').checked?'已開啟本集內容保留':'本集內容不再保留，畫面上的文字仍可使用');});
$('copySubject').addEventListener('click',()=>copyText(buildSubject(),'已複製主旨'));
$('copyBody').addEventListener('click',()=>copyText(buildBody(),'已複製內文'));
$('gmailBtn').addEventListener('click',()=>{if(!validEmail(settings.to)){openSettings();return;}if(!$('ep').checkValidity()){switchTab('edit');$('ep').reportValidity();return;}if(selectedShow()==='__other__'&&!showName()){toast('請先填寫節目名稱');switchTab('edit');$('otherShow').focus();return;}if($('hasSponsor').checked&&!$('sponsor').value.trim()){toast('請先填寫贊助單位');switchTab('edit');$('sponsor').focus();return;}if($('hasSponsor').checked)rememberSponsor();saveDraft();window.open(gmailUrl(),'_blank','noopener,noreferrer');toast('已要求開啟 Gmail；若未出現，請允許彈出視窗。');});
$('clearEpisode').addEventListener('click',()=>{if(!confirm('清空本集的集數、標題、文案、備註與贊助資訊？節目選擇和寄信設定會保留。'))return;clearTimeout(saveTimer);for(const id of ['ep','title','copy','extra','sponsor','otherShow'])$(id).value='';$('date').value=localDate();$('hasSponsor').checked=false;render();saveDraft();$('settingsDialog').close();switchTab('edit');$('title').focus();toast('已清空本集內容');});
// 舊版檔案只當文字解析，不會執行其中的程式。
function parseLegacy(text){const getConst=name=>{const match=text.match(new RegExp('const\\s+'+name+'\\s*=\\s*("[^"\\n]*")\\s*;'));return match?JSON.parse(match[1]):null;};const to=getConst('TO');const base=text.match(/const\s+CC_BASE\s*=\s*(\[[\s\S]*?\])\s*;/);if(!to||!base)throw new Error('找不到舊版設定，請選取原本的審聽信 HTML。');const cc=JSON.parse(base[1]),sponsorCc=getConst('CC_SPONSOR');if(!validEmail(to)||!Array.isArray(cc)||!cc.every(v=>typeof v==='string'&&validEmail(v))||(sponsorCc&&!validEmail(sponsorCc)))throw new Error('檔案內的信箱格式不正確，請手動填寫設定。');const greeting=text.match(/let\s+b\s*=\s*"([^"\n]*?)\\n"/);const signature=text.match(/b\s*\+=\s*"\\n([^"\n]+)"\s*;\s*return\s+b\s*;/);return {...DEFAULTS,to,cc,sponsorCc:sponsorCc?[sponsorCc]:[],greeting:greeting?greeting[1]:DEFAULTS.greeting,signature:signature?signature[1]:''};}
$('importBtn').addEventListener('click',()=>$('importFile').click());
$('importFile').addEventListener('change',async event=>{const file=event.target.files[0];if(!file)return;try{if(file.size>2*1024*1024)throw new Error('檔案太大，請選取原本的審聽信 HTML。');const imported=parseLegacy(await file.text());populateSettings(imported);$('settingsError').hidden=true;toast('已帶入舊版設定，確認後按「儲存設定」。');}catch(error){$('settingsError').textContent=error.message;$('settingsError').hidden=false;}finally{event.target.value='';}});
$('date').value=localDate();$('rememberDraft').checked=read(KEYS.remember,true)!==false;if($('rememberDraft').checked)restoreDraft();else remove(KEYS.draft);renderHistory();render();storageState();
window.addEventListener('pagehide',saveDraft);
</script></body></html>
